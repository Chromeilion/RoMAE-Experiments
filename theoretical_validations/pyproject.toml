[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["theoretical_validations"]

[project]
name = "theoretical_validations"
description = "An experiment that explores how RoMAE is able to interact with positional information."

version = "0.0.1"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Uros Zivanovic", email = "uros.zivanovic@studenti.units.it"},
]
maintainers = [
    {name = "Uros Zivanovic", email = "uros.zivanovic@studenti.units.it"},
]
dependencies = []

[project.urls]
Repository = "https://github.com/Chromeilion/RoMAE-Experiments"
