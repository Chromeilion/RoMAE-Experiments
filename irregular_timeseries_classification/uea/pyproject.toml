[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["uea"]

[project]
name = "uea"
description = "Train RoMAE on various UEA datasets."

version = "0.0.1"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Uros Zivanovic", email = "uros.zivanovic@studenti.units.it"},
]
maintainers = [
    {name = "Uros Zivanovic", email = "uros.zivanovic@studenti.units.it"},
]
# Add in any dependancies your experiment has here
dependencies = ["scipy", "tqdm", "torch", "scikit-learn"]

[project.urls]
Repository = "https://github.com/Chromeilion/RoMAE-Experiments"
